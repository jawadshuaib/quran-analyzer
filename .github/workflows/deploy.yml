name: Build & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/quran-root-analyzer

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          # Capture deploy metadata so the running container can
          # surface "last updated on X via commit Y" in the admin
          # dashboard. The data is baked into the image as ENV vars
          # at build time (see Dockerfile), so a container restart
          # carries the same info, and a fresh build = fresh info.
          GIT_SHA="${{ github.sha }}"
          GIT_SHA_SHORT="$(git rev-parse --short HEAD)"
          GIT_DATE="$(git log -1 --format=%cI HEAD)"
          # Truncate the commit subject to 200 chars; long subjects
          # would just clutter the dashboard.
          GIT_MESSAGE="$(git log -1 --format=%s HEAD | cut -c1-200)"
          docker build \
            --build-arg "BUILD_GIT_SHA=${GIT_SHA}" \
            --build-arg "BUILD_GIT_SHA_SHORT=${GIT_SHA_SHORT}" \
            --build-arg "BUILD_GIT_DATE=${GIT_DATE}" \
            --build-arg "BUILD_GIT_MESSAGE=${GIT_MESSAGE}" \
            -t "${IMAGE_TAG}:latest" -t "${IMAGE_TAG}:${{ github.sha }}" .
          docker push "${IMAGE_TAG}:latest"
          docker push "${IMAGE_TAG}:${{ github.sha }}"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /opt/quran-root-analyzer
            # The new image is ~4.7 GB extracted; the server has a 38 GB
            # disk shared with the `iv-*` project's images and our
            # /var/lib/docker/volumes (8+ GB of runtime data, growing).
            # We need ≥6 GB free BEFORE pulling — anything less risks the
            # overlayfs extract crashing mid-layer (which leaves orphan
            # snapshots that take more cleanup to recover from).
            #
            # Strategy:
            #   1. Always-on cleanup: builder cache (no `until` filter —
            #      cache from a previous build is not useful for the
            #      pull-only workflow). Frees ~4 GB on a typical run.
            #   2. Old image prune (24h+) — keeps the previous tagged
            #      image around for one cycle in case we need to roll
            #      back via SSH.
            #   3. Disk-pressure check: if free space is still < 6 GB,
            #      drop the rollback safety net and prune unused images
            #      aggressively. Logs a warning so we notice the trend.
            #
            # `|| true` on the prune calls so a stale prune lock doesn't
            # itself take down the deploy.
            docker builder prune -af || true
            docker image prune -af --filter "until=24h" || true

            FREE_KB=$(df -k / | awk 'NR==2 {print $4}')
            FREE_GB=$((FREE_KB / 1024 / 1024))
            echo "[deploy] free disk after first prune pass: ${FREE_GB} GB"
            if [ "$FREE_GB" -lt 6 ]; then
              echo "[deploy] ⚠ free space < 6 GB — pruning unused images aggressively"
              docker image prune -af || true
              FREE_KB=$(df -k / | awk 'NR==2 {print $4}')
              FREE_GB=$((FREE_KB / 1024 / 1024))
              echo "[deploy] free disk after aggressive prune: ${FREE_GB} GB"
            fi

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --force-recreate
            # Mop up the now-dangling previous image after the swap.
            docker image prune -f
