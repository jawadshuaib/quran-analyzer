<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- PWA / home-screen install -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#1c1917" />
    <meta name="application-name" content="al-nuqta" />
    <!-- iOS home-screen icon + meta -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="al-nuqta" />

    <!-- SEO_META_START
      serve_spa (roots/backend/app.py) replaces everything from here to
      SEO_META_END with the title + meta for the requested path, so crawlers
      see per-page tags without running JS. Keep both markers: without them
      every page ships these homepage tags (canonical → "/"). What's below is
      the homepage fallback, used by the Vite dev server.
    -->
    <title>al-nuqta — A Root Based Translation of the Quran</title>
    <meta name="description" content="Explore Quranic Arabic through its root words. Trace any word back to its Semitic origins, compare cross-references, and study morphology — all grounded in the Quran's own usage." />
    <link rel="canonical" href="https://al-nuqta.com/" />

    <!-- Open Graph -->
    <meta property="og:title" content="al-nuqta — A Root Based Translation of the Quran" />
    <meta property="og:description" content="Explore Quranic Arabic through its root words. Trace any word back to its Semitic origins, compare cross-references, and study morphology." />
    <meta property="og:url" content="https://al-nuqta.com/" />
    <meta property="og:site_name" content="al-nuqta" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://al-nuqta.com/og-default.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="al-nuqta — A Root Based Translation of the Quran" />
    <meta name="twitter:description" content="Explore Quranic Arabic through its root words. Trace any word back to its Semitic origins, compare cross-references, and study morphology." />
    <meta name="twitter:image" content="https://al-nuqta.com/og-default.png" />
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "al-nuqta",
      "alternateName": "A Root Based Translation of the Quran",
      "url": "https://al-nuqta.com",
      "description": "Explore Quranic Arabic through its root words. Trace any word back to its Semitic origins, compare cross-references, and study morphology — all grounded in the Quran's own usage.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://al-nuqta.com/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <!-- SEO_META_END -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Two Arabic fonts loaded independently. Amiri is PRIMARY —
      Scheherazade New (Google Fonts release) drops the kasra glyph
      when combined with shadda, rendering رَبِّكَ ("rabbi-ka") as
      رَبَّكَ ("rabba-ka"). Verified on prod by side-by-side test
      injections. Amiri renders shadda+kasra correctly. Scheherazade
      New stays as a secondary fallback for unusual codepoints
      Amiri might not cover.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <!-- Two glyphs only (ʾ ʿ): the serif stack (ui-serif/Georgia) has no
         transliteration hamza/ʿayn marks and borrows an over-wide fallback
         glyph, so "Qurʾān" set in serif reads "Qur ʾān". -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;500&text=%CA%BE%CA%BF&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
